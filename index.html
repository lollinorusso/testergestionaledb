<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Borgo Don Bosco - Gestione APS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- External Libraries (jspdf & SweetAlert2 Modals) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        'bdb-blue': '#0033A0',
                        'bdb-blue-dark': '#002266',
                        'bdb-yellow': '#FFD100',
                        'bdb-yellow-light': '#FFE45E',
                        'bdb-gray': '#F8FAFC'
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'glow': '0 0 15px rgba(0, 51, 160, 0.3)'
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #F8FAFC; overflow: hidden; height: 100dvh; }
        .view-section { display: none; height: 100%; overflow-y: auto; padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }
        .view-section.active { display: block; animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .nav-item { position: relative; overflow: hidden; }
        .nav-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background-color: #FFD100; transform: scaleY(0); transition: transform 0.2s ease; border-radius: 0 4px 4px 0; }
        .nav-item.active { background-color: rgba(255, 255, 255, 0.1); color: white; font-weight: 600; }
        .nav-item.active::before { transform: scaleY(1); }
        
        .inner-tab-content { display: none; animation: fadeIn 0.2s ease; }
        .inner-tab-content.active { display: block; }
        .inner-tab-btn { border-bottom: 2px solid transparent; transition: all 0.2s; }
        .inner-tab-btn.active { border-bottom: 2px solid #0033A0; color: #0033A0; font-weight: 700; }

        .glass-modal { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
        tbody tr { transition: all 0.15s ease; }
        tbody tr:hover { background-color: #F1F5F9; }
        .swal2-popup { font-family: 'Plus Jakarta Sans', sans-serif !important; border-radius: 1.5rem !important; }
    </style>
</head>
<body class="text-gray-800 antialiased selection:bg-bdb-yellow selection:text-bdb-blue-dark">

    <div id="authScreen" class="fixed inset-0 bg-bdb-gray z-50 flex items-center justify-center p-4 pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col md:flex-row h-auto max-h-[100dvh]">
            <div class="w-full md:w-5/12 bg-bdb-blue p-8 flex flex-col items-center justify-center text-white relative overflow-hidden hidden md:flex">
                <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/77/Borgodonboscoasti.jpg" alt="Logo BDB" class="w-32 h-32 rounded-full border-4 border-bdb-yellow shadow-glow mb-6 relative z-10 object-cover">
                <h1 class="text-3xl font-extrabold text-center relative z-10 tracking-tight">Borgo Don Bosco</h1>
                <p class="text-bdb-yellow mt-2 text-center text-sm font-medium relative z-10 uppercase tracking-widest">Gestione APS</p>
            </div>

            <div class="w-full md:w-7/12 p-8 md:p-12 flex flex-col justify-center bg-white relative overflow-y-auto">
                <div class="md:hidden text-center mb-6 mt-4">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/77/Borgodonboscoasti.jpg" alt="Logo BDB" class="w-24 h-24 mx-auto rounded-full border-4 border-bdb-yellow shadow-md object-cover mb-3">
                    <h1 class="text-2xl font-extrabold text-bdb-blue tracking-tight">Borgo Don Bosco</h1>
                </div>
                
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Benvenuto!</h2>
                <p class="text-gray-500 mb-8 text-sm">Accedi per gestire l'associazione o il tuo profilo.</p>
                
                <div class="space-y-4">
                    <button type="button" id="googleLoginBtn" class="w-full bg-white border-2 border-gray-100 text-gray-700 font-bold py-3.5 rounded-xl shadow-sm hover:bg-gray-50 hover:border-gray-200 transition-all flex items-center justify-center gap-3">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google">
                        Accedi con Google
                    </button>
                    
                    <div class="relative flex items-center py-2">
                        <div class="flex-grow border-t border-gray-200"></div>
                        <span class="flex-shrink-0 mx-4 text-gray-400 text-xs font-semibold uppercase tracking-wider">oppure con email</span>
                        <div class="flex-grow border-t border-gray-200"></div>
                    </div>

                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-envelope text-gray-400"></i></div>
                        <input type="email" id="authEmail" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-bdb-blue outline-none transition text-base" placeholder="Email">
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-lock text-gray-400"></i></div>
                        <input type="password" id="authPassword" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-bdb-blue outline-none transition text-base" placeholder="Password (es. donbosco)">
                    </div>
                    
                    <button type="button" id="emailLoginBtn" class="w-full bg-bdb-blue text-white font-bold py-3.5 rounded-xl hover:bg-bdb-blue-dark transition-all shadow-md">Accedi con Email</button>
                    
                    <div class="flex justify-between text-center pt-2 text-sm">
                        <button type="button" id="resetPassBtn" class="text-bdb-blue font-medium hover:underline">Password persa?</button>
                        <button type="button" id="registerBtn" class="text-gray-500 font-medium hover:text-gray-800">Crea Account</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden w-full h-[100dvh] flex relative overflow-hidden bg-bdb-gray">
        <div id="mobileOverlay" class="fixed inset-0 bg-black/40 z-30 hidden backdrop-blur-sm transition-opacity duration-300 md:hidden" onclick="app.toggleMenu(false)"></div>
        
        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 z-40 w-72 bg-bdb-blue text-white flex flex-col shrink-0 shadow-2xl md:shadow-xl transform -translate-x-full md:translate-x-0 transition-transform duration-300 pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]">
            <div class="p-6 flex items-center justify-between border-b border-white/10">
                <div class="flex items-center gap-3">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/77/Borgodonboscoasti.jpg" alt="Logo" class="w-12 h-12 rounded-full border-2 border-bdb-yellow object-cover shadow-lg">
                    <div>
                        <span class="font-extrabold text-xl block leading-none tracking-tight">Gestione BDB</span>
                        <span class="text-[10px] text-bdb-yellow uppercase tracking-widest font-bold">APS & Sport</span>
                    </div>
                </div>
                <button class="md:hidden text-white/80 hover:text-white p-2" onclick="app.toggleMenu(false)"><i class="fa-solid fa-chevron-left text-xl"></i></button>
            </div>
            
            <nav id="navMenu" class="flex flex-col gap-2 p-4 overflow-y-auto flex-grow">
                <p class="text-xs font-bold text-white/40 uppercase tracking-widest mb-2 pl-4">Menu Principale</p>
                <button onclick="app.switchTab('dashboard')" class="nav-item active flex items-center gap-3 px-4 py-3 rounded-xl text-white/80 hover:text-white hover:bg-white/10 transition text-left group">
                    <i class="fa-solid fa-chart-pie w-6 text-center group-hover:scale-110 transition-transform"></i> <span class="font-medium">Bacheca</span>
                </button>
                <button onclick="app.switchTab('anagrafica')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-white/80 hover:text-white hover:bg-white/10 transition text-lef
